[package]
name = "CIAToolsN"
version = "26.0.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
fs = "0.0.6"
hostname = "0.4.2"
ratatui = "0.30.2"
rfd = "0.14"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[build-dependencies]
cc = "1"
